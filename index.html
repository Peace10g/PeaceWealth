<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peace WealthFlow</title>
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Personal financial management and wealth growth engine for Peace.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Embedded Web App Manifest for Direct Native Install -->
  <link rel="manifest" id="manifest-placeholder">

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --gold: #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 20px; padding: 12px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    .header h1 { color: var(--text-bright); font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: #8b949e; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h2 { color: var(--gold); font-size: 1.1rem; margin-bottom: 12px; }
    .metric { font-size: 1.8rem; font-weight: 800; color: var(--text-bright); margin: 8px 0; }
    .btn { display: block; width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.95rem; }
    .btn:active { background: var(--accent-hover); }
    .install-banner { display: none; background: #1f6feb; color: white; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 16px; font-weight: 600; }
  </style>
</head>
<body>

  <div id="installBanner" class="install-banner">
    📲 Tap here to Install Peace WealthFlow to your phone
  </div>

  <div class="header">
    <h1>Peace WealthFlow</h1>
    <p>Welcome back, Peace! 👋</p>
  </div>

  <div class="card">
    <h2>Financial Overview</h2>
    <p>Total Portfolio Balance</p>
    <div class="metric">₦0.00</div>
    <button class="btn" onclick="alert('WealthFlow Active!')">Manage Finances</button>
  </div>

  <script>
    // Generate inline PWA Manifest
    const manifest = {
      "name": "Peace WealthFlow",
      "short_name": "Peace App",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#0d1117",
      "theme_color": "#0d1117",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23238636'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='white' font-size='50' font-family='sans-serif'>P</text></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.querySelector('#manifest-placeholder').setAttribute('href', manifestURL);

    // Register Service Worker for offline/standalone functionality
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
      `;
      const swBlob = new Blob([swCode], {type: 'text/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(console.error);
    }

    // Handle Direct Installation Prompt
    let deferredPrompt;
    const banner = document.getElementById('installBanner');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = 'block';
    });

    banner.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          banner.style.display = 'none';
          deferredPrompt = null;
        });
      }
    });
  </script>
</body>
</html>
